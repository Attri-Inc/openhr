services:
  openhr:
    build: .
    # Bind to localhost only — employee records never go on the LAN by default.
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - openhr-data:/data
    environment:
      - OPENHR_DB=/data/openhr.db
      - MCP_TRANSPORT=sse
      - MCP_PORT=8792
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8792), 2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  openhr-data:
